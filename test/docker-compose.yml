services:
  postgres:
    pull_policy: build
    container_name: pg-with-s3-backups
    env_file:
      - .env
    build: 
      context: ../
    ports:
      - 5432:5432
    volumes:
      - ./server.crt:/var/lib/postgresql/server.crt
      - ./server.key:/var/lib/postgresql/server.key
      - pg-cache:/cache

volumes:
  pg-cache:
    external: false
