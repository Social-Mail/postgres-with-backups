# ==============================================================================
# 1. LOCAL CONNECTIONS (Unix Domain Sockets) - Safe & No SSL
# ==============================================================================
local   all             all                                     scram-sha-256
local   replication     postgres                                scram-sha-256

# ==============================================================================
# 2. NETWORK CONNECTIONS (TCP/IP) - Strict Global SSL Enforcement
# ==============================================================================
# Block ALL unencrypted network traffic immediately (Catches all users/databases)
hostnossl   all          all         0.0.0.0/0                  reject
hostnossl   all          all         ::/0                       reject
hostnossl   replication  all         0.0.0.0/0                  reject
hostnossl   replication  all         ::/0                       reject

# Allow secure app connections via SSL
hostssl     all          all         0.0.0.0/0                  scram-sha-256
hostssl     all          all         ::/0                       scram-sha-256

# Allow secure replication via SSL (Upgraded from 'host' + 'md5' to 'hostssl' + 'scram-sha-256')
hostssl     replication  replicator  0.0.0.0/0                  scram-sha-256
hostssl     replication  postgres    0.0.0.0/0                  scram-sha-256
